# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
# Held on purpose — transitive unmaintained-crate advisories, unfixable
# from this repo:
# - RUSTSEC-2025-0141 (bincode 1.x) — unmaintained; the 2.x rewrite is
#   incompatible with the consumers that pull it.
# - RUSTSEC-2026-0173 (proc-macro-error2) — unmaintained; successor exists
#   upstream but the dependents have not moved.
ignore = [
  "RUSTSEC-2025-0141",
  "RUSTSEC-2026-0173",
]
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
