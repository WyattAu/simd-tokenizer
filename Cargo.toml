[package]
exclude = ["/target"]
name = "simd-tokenizer"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/WyattAu/simd-tokenizer"
homepage = "https://github.com/WyattAu/simd-tokenizer"
documentation = "https://docs.rs/simd-tokenizer"
description = "Safe SWAR-accelerated whitespace token estimator with an optional exact tiktoken (cl100k_base, o200k_base) backend."
readme = "README.md"
keywords = ["tokenizer", "tokens", "simd", "llm", "tiktoken"]
categories = ["text-processing"]

[features]
default = []
# Core-only build: the SWAR estimator has no std usage.
std = []
# Exact token counting via tiktoken-rs (cl100k_base, o200k_base). Off by
# default to keep the dependency tree light; the SWAR estimator is always
# available. tiktoken-rs is std-bound, so this implies `std`.
tiktoken = ["dep:tiktoken-rs", "std"]

[dependencies]
thiserror = { version = "2.0", default-features = false }
tiktoken-rs = { version = "0.12", optional = true }

[[bench]]
name = "count"
harness = false

# Deterministic CI perf gate (instruction counts under valgrind). Not run
# locally unless valgrind is installed; see benches/iai_hot_path.rs.
[[bench]]
name = "iai_hot_path"
harness = false

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
# Deterministic CI perf gate (instruction counts; needs valgrind to run).
iai-callgrind = "0.16"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
